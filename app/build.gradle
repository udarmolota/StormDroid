plugins {
    id 'com.android.application'
}

// Release signing key: keystore.properties in the project root, never committed (see .gitignore and
// keystore.properties.example). Without it a release build stays debug-signed for the test cycle.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.isFile()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def hasReleaseKey = keystoreProps.getProperty('storeFile') as boolean

android {
    namespace 'com.stormdroid'
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.stormdroid"
        minSdk = 30
        targetSdk = 35
        versionCode 1
        versionName "0.1.0"
        // JavaSteam + protobuf + kotlin push the app past the 64K method limit.
        multiDexEnabled true
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true   // expose BuildConfig.VERSION_NAME/CODE (used in the launch-config log)
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                def store = keystoreProps.getProperty('storeFile')
                storeFile file(store)
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
                // A .p12 is a PKCS12 store; anything else is left to the default (JKS).
                def type = keystoreProps.getProperty('storeType') ?: (store.toLowerCase().endsWith('.p12') ? 'pkcs12' : null)
                if (type) storeType type
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // The author's key when keystore.properties is present. Otherwise debug-signed, a
            // test-cycle convenience: adb install -r then replaces the debug build without wiping app data.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        // The Mono runtime (jniLibs) and the Unity player libraries are dlopen()ed from nativeLibraryDir.
        jniLibs.useLegacyPackaging = true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            // versionName above is the single source of truth for local and CI filenames.
            outputFileName = "stormdroid-${variant.buildType.name}-${variant.versionName}.apk"
        }
    }
}

dependencies {
    // Unity's Android player with il2mono and vkshim (":unity" process); see unity/build.gradle.
    implementation project(':unity')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'commons-io:commons-io:2.15.1'   // required by commons-compress 1.26.x at runtime
    implementation 'org.tukaani:xz:1.11'
    implementation 'com.google.code.gson:gson:2.10.1'

    // In-app Steam download (SteamDownloader, from ValDroid/RimDroid): JavaSteam (MIT, a SteamKit2 port)
    // for the sign-in, licenses, depot keys and CDN chunks. bcprov + protobuf-java are its "optional"
    // deps, at the versions JavaSteam 1.8.0 was built against. The depot-downloader artifact brings the
    // ktor HTTP client the CDN code uses; zstd-jni (@aar: Android natives) decompresses zstd chunks.
    implementation 'in.dragonbra:javasteam:1.8.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'in.dragonbra:javasteam-depotdownloader:1.8.0'
    implementation 'com.github.luben:zstd-jni:1.5.7-6@aar'
}
