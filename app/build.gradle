plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stormdroid'
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.stormdroid"
        minSdk = 30
        targetSdk = 35
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true   // expose BuildConfig.VERSION_NAME/CODE (used in the launch-config log)
    }

    buildTypes {
        release {
            minifyEnabled false
            // Test-cycle convenience: debug-signed release so adb install -r replaces the
            // debug build without wiping app data. Real distribution re-signs anyway.
            signingConfig signingConfigs.debug
        }
        debug {
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        // The Mono runtime (jniLibs) and the Unity player libraries are dlopen()ed from nativeLibraryDir.
        jniLibs.useLegacyPackaging = true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            // versionName above is the single source of truth for local and CI filenames.
            outputFileName = "stormdroid-${variant.buildType.name}-${variant.versionName}.apk"
        }
    }
}

dependencies {
    // Unity's Android player with il2mono and vkshim (":unity" process); see unity/build.gradle.
    implementation project(':unity')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'commons-io:commons-io:2.15.1'   // required by commons-compress 1.26.x at runtime
    implementation 'org.tukaani:xz:1.11'
    implementation 'com.google.code.gson:gson:2.10.1'
}
